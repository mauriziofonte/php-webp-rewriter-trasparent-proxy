# nginx configuration of the performance suite: the one of the integration
# harness, which mounts the official configuration of config/nginx/ at
# /etc/nginx/proxy-cdn/, plus the baseline. Benchmark only.

include /etc/nginx/proxy-cdn/proxy-cdn-maps.conf;

# The load generator runs in a container of the compose network: every
# address of the network is trusted.
map $remote_addr $proxycdn_trusted_proxy {
    default 1;
}

upstream proxycdn_php {
    server fpm-nginx:9000;
}

server {
    listen 80 default_server;
    server_name _;
    root /app/public;

    include /etc/nginx/proxy-cdn/proxy-cdn-locations.conf;
}

# The baseline: the same files served as plain static files by the same
# server.
server {
    listen 8080;
    server_name _;
    root /static;
    etag on;
}
