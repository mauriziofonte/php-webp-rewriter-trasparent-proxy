# Apache configuration of the performance suite: the one of the integration
# harness (mounted as harness.conf: public/.htaccess on port 80), plus the
# rules form under test, the baseline and the trust the suite needs.
# Benchmark only.

Include conf/harness.conf

# Written by run.sh: by default the rules of public/.htaccess included in
# the <Directory> of the document root with "AllowOverride None", as
# config/apache/proxy-cdn.conf recommends; empty with --apache-htaccess,
# which keeps "AllowOverride All" of the harness.
Include conf/rules.conf

# The load generator runs in a container of the compose network, whose
# address the harness does not trust.
SetEnvIfExpr "%{HTTP:X-Forwarded-Proto} == 'https'" PROXYCDN_HTTPS=on
# The PROXY_HOSTS of the suite, redirected to https.
SetEnvIfNoCase Host "^(apache|nginx)(:[0-9]+)?$" PROXYCDN_HOST=on

# The baseline: the same files served as plain static files by the same
# server, without rewriting or added headers.
Listen 8080
<VirtualHost *:8080>
    DocumentRoot "/static"
    <Directory "/static">
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
