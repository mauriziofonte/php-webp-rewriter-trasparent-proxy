; PHP settings of the integration harness. The proxy writes its own log
; (logs/proxy.log), so this log catches PHP errors only (autoloading,
; platform checks, fatal errors).
;
; Errors are displayed here on purpose, and post_max_size is small: the
; web server configurations must force display_errors off themselves
; (PHP_ADMIN_VALUE), which run.sh checks with a POST above 1K.
display_errors = On
display_startup_errors = On
post_max_size = 1K
log_errors = On
error_log = /var/log/harness/php-error.log
error_reporting = E_ALL
