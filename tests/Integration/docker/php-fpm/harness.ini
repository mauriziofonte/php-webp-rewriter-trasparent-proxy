; PHP settings of the integration harness. public/index.php turns
; display_errors off and the proxy writes its own log (logs/proxy.log), so
; this log catches PHP errors only (autoloading, platform checks, fatal errors).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/harness/php-error.log
error_reporting = E_ALL
