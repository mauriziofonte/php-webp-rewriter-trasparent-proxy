; PHP-FPM pool overrides of the integration harness, loaded after the image's
; zz-docker.conf. The access log records one line per request that reached
; PHP, which is how the harness proves that a cache hit never did.

[www]
access.log = /var/log/harness/php-fpm-access.log
access.format = "%t \"%m %{REQUEST_URI}e\" %s %{mili}dms"
catch_workers_output = yes
