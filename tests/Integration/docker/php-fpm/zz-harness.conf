; PHP-FPM pool overrides of the integration harness, loaded after the image's
; zz-docker.conf. The access log records one line per request that reached
; PHP, for troubleshooting: run.sh takes the route of each request from the
; log of the web server instead, since a worker writes this line only once
; the script has ended, after the client already has the response.

[www]
access.log = /var/log/harness/php-fpm-access.log
access.format = "%t \"%m %{REQUEST_URI}e\" %s %{mili}dms"
catch_workers_output = yes

; Enough workers for the coalescing test of run.sh to have dozens of
; requests for one cold entry inside PHP at the same time.
pm = static
pm.max_children = 32
