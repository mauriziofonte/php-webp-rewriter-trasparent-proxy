# nginx configuration of the integration harness: the official configuration
# of config/nginx/ (mounted at /etc/nginx/proxy-cdn/), with the harness
# values of the three things it leaves to the including configuration.

include /etc/nginx/proxy-cdn/proxy-cdn-maps.conf;

# The trusted reverse proxy: the gateway of the compose network, the source
# address of the requests run.sh sends from the host (the address ends in
# ".1"). The other containers, whose X-Forwarded-Proto must be ignored, have
# other addresses.
map $remote_addr $proxycdn_trusted_proxy {
    default 0;
    "~^[0-9.]+\.1$" 1;
}

# The PROXY_HOSTS of the harness.
map $host $proxycdn_known_host {
    default 0;
    127.0.0.1 1;
}

# The route of each request, for run.sh: the X-Harness-Request id it sent,
# then the PHP-FPM address when it reached PHP ("-" when nginx served a
# file alone). Written when the response is complete, unlike the access
# log of PHP-FPM, which a worker writes once the script has ended, after
# fastcgi_finish_request() and the work that follows it.
log_format harness_route '$http_x_harness_request $upstream_addr $status "$request"';

upstream proxycdn_php {
    server fpm-nginx:9000;
}

server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    access_log /var/log/nginx/access.log main;
    access_log /var/log/harness/web-access.log harness_route;

    include /etc/nginx/proxy-cdn/proxy-cdn-locations.conf;
}
