# nginx configuration of the integration harness. HARNESS ONLY: 2.x ships no
# nginx configuration, so this file translates the routing of
# public/.htaccess rule by rule to exercise the proxy behind nginx. It is not
# a recommended production configuration; the official one arrives with
# PRX-6.

# .htaccess redirects to https unless HTTPS is on or a TLS-terminating proxy
# sent "X-Forwarded-Proto: https". The harness speaks plain HTTP, so only the
# header can switch the redirect off.
map $http_x_forwarded_proto $harness_redirect_to_https {
    default 1;
    https   0;
}

server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.html;
    autoindex off;
    server_tokens off;

    # PURGE and OPTIONS always reach PHP, as in .htaccess.
    if ($request_method ~ "^(PURGE|OPTIONS)$") {
        rewrite ^ /index.php last;
    }

    # FilesMatch: project metadata, the compiled configuration and the
    # temporary files of atomicWrite().
    location ~ "/(\.(ht[^/]*|git[^/]*|env[^/]*|cached\.env\.php|config\.cache\.php|mftpcdn\.[^/]*)|composer\.(json|lock)|(README|readme)\.md|LICENSE|license)$" {
        return 403;
    }

    # FilesMatch: negative-cache markers.
    location ~ "\.(404|netfail)$" {
        return 403;
    }

    # Defensive 403s for internal directories and the query-string buckets.
    location ~ "/(\.git|vendor|src|bin|logs|_qs)(/|$)" {
        if ($harness_redirect_to_https) {
            return 301 https://$http_host$request_uri;
        }
        return 403;
    }

    # The front controller. The original URI stays in REQUEST_URI, so the
    # proxy derives the requested path exactly as it does behind Apache.
    location = /index.php {
        if ($harness_redirect_to_https) {
            return 301 https://$http_host$request_uri;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REMOTE_USER $http_authorization;
        fastcgi_pass fpm-nginx:9000;
    }

    # Raster images: query strings and misses go to PHP; a hit with a .webp
    # sibling on disk is redirected to it, as .htaccess does.
    location ~* "^/(.+)\.(jpe?g|png|gif|bmp)$" {
        if ($harness_redirect_to_https) {
            return 301 https://$http_host$request_uri;
        }
        if ($args != "") {
            rewrite ^ /index.php last;
        }
        if (!-f $request_filename) {
            rewrite ^ /index.php last;
        }
        set $harness_webp_sibling $document_root/$1.webp;
        set $harness_webp_uri /$1.webp;
        if (-f $harness_webp_sibling) {
            return 301 $harness_webp_uri;
        }
        add_header X-Cache-Status HIT;
    }

    # Everything else: any query string goes to PHP, existing files and
    # directories are served from disk, misses go to PHP.
    location / {
        if ($harness_redirect_to_https) {
            return 301 https://$http_host$request_uri;
        }
        if ($args != "") {
            rewrite ^ /index.php last;
        }
        try_files $uri $uri/ /index.php;
        add_header X-Cache-Status HIT;
    }
}
