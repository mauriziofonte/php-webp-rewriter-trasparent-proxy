# Apache configuration of the integration harness. HARNESS ONLY: it loads the
# modules public/.htaccess relies on, points the DocumentRoot at the
# application copy and hands PHP to the fpm-apache service. Routing, access
# rules and headers come from public/.htaccess, unchanged; the trusted proxy
# is set as config/apache/proxy-cdn.conf documents it.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h \"%r\" %>s %b %{X-Cache-Status}o %Dus" harness
CustomLog /proc/self/fd/1 harness
# The route of each request, for run.sh: the X-Harness-Request id it sent,
# then the handler of the final request ("proxy-server" when it reached
# PHP-FPM, "-" when Apache served a file). Written when the response is
# complete, unlike the access log of PHP-FPM, which a worker writes once
# the script has ended, after fastcgi_finish_request() and the work that
# follows it.
LogFormat "%{X-Harness-Request}i %>R %>s \"%r\"" harness_route
CustomLog /var/log/harness/web-access.log harness_route

TypesConfig conf/mime.types

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/app/public"
<Directory "/app/public">
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html

# The trusted reverse proxy: the gateway of the compose network, the source
# address of the requests run.sh sends from the host (the address ends in
# ".1"). The other containers, whose X-Forwarded-Proto must be ignored, have
# other addresses.
SetEnvIfExpr "%{REMOTE_ADDR} =~ /^[0-9.]+\.1$/ && %{HTTP:X-Forwarded-Proto} == 'https'" PROXYCDN_HTTPS=on
# The PROXY_HOSTS of the harness, redirected to https.
SetEnvIfNoCase Host "^127\.0\.0\.1(:[0-9]+)?$" PROXYCDN_HOST=on

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://fpm-apache:9000"
</FilesMatch>
# As config/apache/proxy-cdn.conf: a miss may wait for the coalescing
# timeout.
ProxyTimeout 300
