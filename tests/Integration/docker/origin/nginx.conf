# Fake origin of the integration harness: nginx with its bundled njs module
# (origin.js). It serves tests/Fixtures/origin, counts the requests it
# receives, and can delay a response or answer with another status code.
# Harness only.

load_module modules/ngx_http_js_module.so;

worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format origin '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout origin;

    js_path /etc/nginx/njs/;
    js_import origin from origin.js;

    # Shared by every worker: request counts per path, and the rules set
    # through the control API.
    js_shared_dict_zone zone=origin_counts:1m type=number;
    js_shared_dict_zone zone=origin_rules:1m;

    server {
        listen 80;
        server_name _;
        root /srv/origin;
        etag on;

        location /__origin/ {
            js_content origin.control;
        }

        location / {
            js_content origin.serve;
        }

        # Target of origin.serve once it decides to answer with the file.
        location @file {
            try_files $uri =404;
        }
    }
}
