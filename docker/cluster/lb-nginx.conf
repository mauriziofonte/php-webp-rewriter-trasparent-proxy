# The load balancer of the example. In production it terminates TLS; here it
# listens on plain HTTP and tells the nodes that the client used https.
# Point the health check of a real load balancer at GET /healthz.

upstream proxy_cdn_nodes {
    server node-a:80 max_fails=2 fail_timeout=10s;
    server node-b:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    location / {
        proxy_pass http://proxy_cdn_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
