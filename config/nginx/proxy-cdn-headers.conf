# PHP Proxy CDN: the headers of a cache file served by nginx, the same PHP
# sends (Http\ResponseFactory::assetHeaders()), for the files nginx finds
# by itself. Included by proxy-cdn-locations.conf; the X-Cache-Status of
# each location is set there. Cache-Control must carry the CACHE_EXPIRY of
# the proxy.

add_header Cache-Control "public, max-age=31536000, must-revalidate" always;
include /etc/nginx/proxy-cdn/proxy-cdn-asset-headers.conf;
