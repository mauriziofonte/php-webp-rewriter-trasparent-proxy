# PHP Proxy CDN: the headers of a cache file served by nginx, the same PHP
# sends (Http\ResponseFactory::assetHeaders()). Included by the locations
# of proxy-cdn-locations.conf; the X-Cache-Status of each location is set
# there. Cache-Control must carry the CACHE_EXPIRY of the proxy.

add_header Cache-Control "public, max-age=31536000, must-revalidate" always;
add_header Access-Control-Allow-Origin "*" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy $proxycdn_svg_policy always;
add_header Content-Encoding $proxycdn_content_encoding;
add_header Vary $proxycdn_vary;
# HSTS for this host only (includeSubDomains changes sibling hosts too),
# on https only.
# add_header Strict-Transport-Security "max-age=31536000" always;
