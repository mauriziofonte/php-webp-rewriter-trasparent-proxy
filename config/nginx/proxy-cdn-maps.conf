# PHP Proxy CDN: the maps of the official nginx configuration, for the http
# context (the files of conf.d/ are included there). See proxy-cdn.conf.
#
# They need one variable that the including configuration defines with a
# geo block: $proxycdn_trusted_proxy, 1 for the addresses of the reverse
# proxies whose X-Forwarded-Proto is believed (the TRUSTED_PROXIES of the
# proxy), 0 for every other client.

# Redirect to https unless the connection is TLS, or a trusted proxy says
# that the client used https. X-Forwarded-Proto from anyone else is ignored:
# a client cannot switch the redirect off.
map "$https|$proxycdn_trusted_proxy|$http_x_forwarded_proto" $proxycdn_redirect_to_https {
    default        1;
    "~^on\|"       0;
    "~^\|1\|https$" 0;
}

# The query-string bucket of the request (Cache\CacheKeyResolver): none
# without query string; ".q/<query>" for a query string of plain characters,
# which PHP stores there when it is the canonical one; otherwise a directory
# that never exists, so that the request reaches PHP.
map $args $proxycdn_bucket {
    default "/.php";
    ""      "";
    "~^(?<proxycdn_query>[A-Za-z0-9_~-][A-Za-z0-9._~=&-]{0,199})$" "/.q/$proxycdn_query";
}

# The variants and encodings the client accepts (Http\AcceptHeader): the
# media type or coding listed by name, without q=0. A refused one maps to a
# directory that never exists.
map $http_accept $proxycdn_avif {
    default "/.none";
    "~*(?:^|,)\s*image/avif\s*(?:$|,|;(?![^,]*\bq\s*=\s*0(?:\.0*)?\s*(?:$|,|;)))" "/.avif";
}
map $http_accept $proxycdn_webp {
    default "/.none";
    "~*(?:^|,)\s*image/webp\s*(?:$|,|;(?![^,]*\bq\s*=\s*0(?:\.0*)?\s*(?:$|,|;)))" "/.webp";
}
map $http_accept_encoding $proxycdn_br {
    default "/.none";
    "~*(?:^|,)\s*br\s*(?:$|,|;(?![^,]*\bq\s*=\s*0(?:\.0*)?\s*(?:$|,|;)))" "/.br";
}
map $http_accept_encoding $proxycdn_gz {
    default "/.none";
    "~*(?:^|,)\s*gzip\s*(?:$|,|;(?![^,]*\bq\s*=\s*0(?:\.0*)?\s*(?:$|,|;)))" "/.gz";
}

# The headers of the cache file nginx serves, read from its path once
# try_files or X-Accel-Redirect has chosen it.
map $uri $proxycdn_content_encoding {
    default "";
    "~^/_cache/[^/]+(?:/\.q/[^/]+)?/\.br/" br;
    "~^/_cache/[^/]+(?:/\.q/[^/]+)?/\.gz/" gzip;
}
map $uri $proxycdn_vary {
    default "";
    "~*\.(?:jpe?g|png|gif|bmp)(?:\.avif|\.webp)?$" Accept;
    "~*\.(?:css|js|mjs|json|map|svg|txt|xml|ico|ttf|ttc|otf|eot)$" Accept-Encoding;
}
# An SVG opened from the CDN runs no script (finding P-7): the policy of
# Http\ResponseFactory::SVG_CONTENT_SECURITY_POLICY.
map $uri $proxycdn_svg_policy {
    default "";
    "~*\.svg$" "default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; sandbox";
}
