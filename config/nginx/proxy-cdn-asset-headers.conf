# PHP Proxy CDN: the headers of a cache file served by nginx, but
# Cache-Control. A file PHP hands over with X-Accel-Redirect keeps the
# Cache-Control PHP sent (nginx passes it on), so the internal /_cache/
# location of proxy-cdn-locations.conf includes this file alone, and
# proxy-cdn-headers.conf adds Cache-Control for the files nginx finds by
# itself: either way, one Cache-Control.

add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Timing-Allow-Origin "*" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy $proxycdn_svg_policy always;
add_header Content-Encoding $proxycdn_content_encoding;
add_header Vary $proxycdn_vary;
# HSTS for this host only (includeSubDomains changes sibling hosts too),
# on https only.
# add_header Strict-Transport-Security "max-age=31536000" always;
