# PHP Proxy CDN: how nginx hands a request to public/index.php. The
# original URI stays in REQUEST_URI, from which the proxy reads the path.
# The upstream "proxycdn_php" is defined by the including configuration.

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
# nginx takes the files PHP hands over with X-Accel-Redirect (SENDFILE =
# "x-accel-redirect"), from the internal /_cache/ location: PHP does so
# only when this variable says it.
fastcgi_param PROXYCDN_SENDFILE x-accel-redirect;
# httpoxy: a "Proxy" request header must never become HTTP_PROXY.
fastcgi_param HTTP_PROXY "";
fastcgi_hide_header X-Powered-By;
fastcgi_pass proxycdn_php;
