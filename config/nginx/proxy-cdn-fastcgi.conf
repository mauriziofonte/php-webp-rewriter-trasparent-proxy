# PHP Proxy CDN: how nginx hands a request to public/index.php. The
# original URI stays in REQUEST_URI, from which the proxy reads the path.
# The upstream "proxycdn_php" is defined by the including configuration.

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
# nginx takes the files PHP hands over with X-Accel-Redirect (SENDFILE =
# "x-accel-redirect"), from the internal /_cache/ location: PHP does so
# only when this variable says it.
fastcgi_param PROXYCDN_SENDFILE x-accel-redirect;
# httpoxy: a "Proxy" request header must never become HTTP_PROXY.
fastcgi_param HTTP_PROXY "";
# PHP prints the errors it raises before the proxy runs (such as a body
# above post_max_size) by its php.ini, which may display them (the
# official images ship none): they would become the body, with a 200.
# public/index.php and DEBUG cannot turn them back on.
fastcgi_param PHP_ADMIN_VALUE "display_errors=Off\ndisplay_startup_errors=Off";
fastcgi_hide_header X-Powered-By;
# A request that misses waits for the one fetching the same entry for up
# to the coalescing timeout (60 s by default, up to 210 s with a resize
# by the conversion API and its fallback: see the README), longer than
# the 60 s nginx waits by default. The variants of an image are made
# after the response, which this timeout does not bound.
fastcgi_read_timeout 300s;
fastcgi_pass proxycdn_php;
