# PHP Proxy CDN: official nginx configuration, for the http context (for
# example /etc/nginx/conf.d/proxy-cdn.conf). Copy config/nginx/ of the
# project to /etc/nginx/proxy-cdn/, then adjust the three marked values:
# the PHP-FPM address, the document root and the TLS certificate.
#
# nginx serves every cache hit itself (static-file speed, no PHP), and
# hands the rest to public/index.php.
# Every host of PROXY_HOSTS is served by this server block; server_name may
# list them, but the proxy refuses any other host itself (421).

include /etc/nginx/proxy-cdn/proxy-cdn-maps.conf;

# The reverse proxies whose X-Forwarded-Proto is believed: the same list as
# TRUSTED_PROXIES. Empty by default: X-Forwarded-Proto is then ignored.
geo $proxycdn_trusted_proxy {
    default 0;
    # 10.0.0.0/8 1;
}

upstream proxycdn_php {
    server unix:/run/php/php-fpm.sock;   # adjust: the PHP-FPM pool of the proxy
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /srv/proxy-cdn/public;           # adjust: public/ of the project

    ssl_certificate     /etc/ssl/certs/cdn.example.com.pem;    # adjust
    ssl_certificate_key /etc/ssl/private/cdn.example.com.key;  # adjust
    # HSTS: nginx drops the add_header of a server block in a location that
    # has its own, as the cache locations do; uncomment the line of
    # proxy-cdn-headers.conf as well.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/proxy-cdn/proxy-cdn-locations.conf;
}
