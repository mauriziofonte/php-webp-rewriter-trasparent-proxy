# PHP Proxy CDN: the media types of Http\MediaTypes, the ones PHP sends,
# for the locations that serve cache files (a test keeps both identical).

types {
    text/css                         css;
    text/javascript                  js mjs;
    application/json                 json map;
    image/svg+xml                    svg;
    image/webp                       webp;
    image/avif                       avif;
    image/vnd.microsoft.icon         ico;
    image/bmp                        bmp;
    image/gif                        gif;
    image/jpeg                       jpg jpeg jpe;
    image/png                        png;
    image/apng                       apng;
    image/tiff                       tif tiff;
    font/ttf                         ttf;
    font/collection                  ttc;
    font/otf                         otf;
    font/woff                        woff;
    font/woff2                       woff2;
    application/vnd.ms-fontobject    eot;
    application/pdf                  pdf;
    text/plain                       txt;
    application/xml                  xml;
    video/mp4                        mp4;
    video/webm                       webm;
    audio/mpeg                       mp3;
}
default_type application/octet-stream;
