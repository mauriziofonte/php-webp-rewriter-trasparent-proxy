# PHP Proxy CDN: the routing of the official nginx configuration, for the
# server context. See proxy-cdn.conf for the variables it needs.
#
# A request for a cache file that nginx can locate is served by nginx,
# without PHP: the file of the host ($host, which nginx validates, in lower
# case and without port) and of the bucket of the query string, as its AVIF
# or WEBP variant or its Brotli or gzip encoding when the client accepts it.
# Everything else reaches public/index.php: misses, query strings PHP must
# map, PURGE and OPTIONS.

server_tokens off;
etag on;

# $host is the Host header without its port: HTTPS is served on 443, and
# public/.htaccess redirects the same way. Only the hosts of
# $proxycdn_known_host are redirected, with "Cache-Control: no-store".
add_header Cache-Control $proxycdn_redirect_cache_control always;
if ($proxycdn_redirect_to_https) {
    return 301 https://$host$request_uri;
}

# PURGE is authenticated by PHP, and OPTIONS answered by it, hits included.
if ($request_method ~ "^(PURGE|OPTIONS)$") {
    rewrite ^ /index.php last;
}

# The cache, for X-Accel-Redirect only (SENDFILE=x-accel-redirect): a
# client never reads it directly, which would bypass the host allowlist.
location ^~ /_cache/ {
    internal;
    gzip off;
    include /etc/nginx/proxy-cdn/proxy-cdn-types.conf;
    add_header X-Cache-Status $upstream_http_x_cache_status always;
    # nginx drops the other headers of PHP on an X-Accel-Redirect: the
    # request ID of the log entries (PRX-9) is passed on like X-Cache-Status.
    add_header X-Request-Id $upstream_http_x_request_id always;
    # Cache-Control is the one of PHP, which nginx passes on.
    include /etc/nginx/proxy-cdn/proxy-cdn-asset-headers.conf;
}

# Dot files and directories and the buckets of 2.x are never served. The
# names of the project directories ("vendor", "src"...) are not refused:
# root is public/, where none of them exists, and an origin may well serve
# "/vendor/livewire/livewire.js".
location ~ "(?:^|/)(?:\.|_qs(?:/|$))" {
    return 403;
}

# A file: served from the cache when nginx can locate it.
location ~ "\.[A-Za-z0-9]+$" {
    gzip off;
    include /etc/nginx/proxy-cdn/proxy-cdn-types.conf;
    try_files
        /_cache/$host$proxycdn_bucket$proxycdn_avif$uri.avif
        /_cache/$host$proxycdn_bucket$proxycdn_webp$uri.webp
        /_cache/$host$proxycdn_bucket$proxycdn_br$uri
        /_cache/$host$proxycdn_bucket$proxycdn_gz$uri
        /_cache/$host$proxycdn_bucket$uri
        @proxycdn_php;
    add_header X-Cache-Status HIT always;
    include /etc/nginx/proxy-cdn/proxy-cdn-headers.conf;
}

location / {
    try_files /index.php-never-a-file @proxycdn_php;
}

# The front controller, for internal rewrites only.
location = /index.php {
    internal;
    include /etc/nginx/proxy-cdn/proxy-cdn-fastcgi.conf;
}

location @proxycdn_php {
    include /etc/nginx/proxy-cdn/proxy-cdn-fastcgi.conf;
}
