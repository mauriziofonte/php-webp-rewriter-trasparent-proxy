; PHP Proxy CDN: the php.ini settings of the PHP-FPM pool (or mod_php) that
; runs public/index.php, for example /etc/php/8.4/fpm/conf.d/99-proxy-cdn.ini.
; Adjust the marked values. The performance suite (tests/Performance) runs
; with this file.

; OPcache keeps the compiled code in shared memory. Some distributions and
; the official Docker images up to PHP 8.4 ship it without loading it: then
; also add the line "zend_extension=opcache". PHP 8.5 has it built in.
opcache.enable=1
; The proxy invalidates its compiled configuration (.config.cache.php)
; itself whenever it rewrites it, so the timestamps of the code are the
; only ones OPcache needs to check; with 0, restart PHP-FPM after each
; deployment.
opcache.validate_timestamps=1

; The paths a request resolves (autoloader, cache lookups) stay resolved
; for every request of the worker. 4096K is the default since PHP 7.3;
; PHP 7.2 defaults to 16K.
realpath_cache_size=4096K

; Preloading, PHP 7.4 and later (PHP 7.2 and 7.3 ignore both lines): the
; classes of a request are compiled and linked once, when PHP-FPM starts.
; Restart PHP-FPM after each deployment or "composer install", and read the
; header of preload.php before enabling it next to other applications.
; adjust: config/php/preload.php of the project, and the user of the pool
;opcache.preload=/srv/proxy-cdn/config/php/preload.php
;opcache.preload_user=www-data
