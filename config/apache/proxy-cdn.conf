# PHP Proxy CDN: an Apache virtual host for the proxy (for example
# /etc/apache2/sites-available/proxy-cdn.conf). The routing and the headers
# live in public/.htaccess, which the virtual host includes; adjust the
# marked values.
#
# Modules: rewrite, headers, setenvif, env, mime, proxy_fcgi (or mod_php), and,
# for SENDFILE=x-sendfile, the third-party mod_xsendfile.
#
# Apache serves every cache hit itself (static-file speed, no PHP), and
# hands the rest to public/index.php. Every host of PROXY_HOSTS may be
# served by this virtual host (ServerAlias); the proxy refuses any other
# host itself (421).

<VirtualHost *:443>
    # adjust
    ServerName cdn.example.com
    # ServerAlias static.example.org                # the other PROXY_HOSTS

    # adjust: public/ of the project
    DocumentRoot /srv/proxy-cdn/public
    # The cache directory is named after the Host header (the default).
    UseCanonicalName Off

    # The rules of public/.htaccess, read once when Apache starts: with
    # "AllowOverride All" instead of the Include, Apache parses the file on
    # every request, which about doubles the cost of a hit (measured with
    # tests/Performance, see the README). Reload Apache after editing the
    # file. Where the virtual host cannot be changed (shared hosting),
    # "AllowOverride All" without the Include works the same, slower.
    # adjust
    <Directory /srv/proxy-cdn/public>
        AllowOverride None
        Require all granted
        # adjust
        Include /srv/proxy-cdn/public/.htaccess
    </Directory>

    <FilesMatch "\.php$">
        # adjust
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>
    # A request that misses waits for the one fetching the same entry for
    # up to the coalescing timeout (60 s by default, up to 210 s with a
    # resize by the conversion API and its fallback: see the README),
    # longer than the 60 s Timeout of the httpd defaults. The variants of
    # an image are made after the response, which this timeout does not
    # bound.
    ProxyTimeout 300

    SSLEngine on
    # adjust
    SSLCertificateFile    /etc/ssl/certs/cdn.example.com.pem
    # adjust
    SSLCertificateKeyFile /etc/ssl/private/cdn.example.com.key

    # Behind a TLS-terminating reverse proxy or load balancer, list its
    # addresses here, as in TRUSTED_PROXIES: only they may tell, with
    # X-Forwarded-Proto, that the client used https. Without this line the
    # header is ignored, and plain-HTTP requests are redirected to https.
    # SetEnvIfExpr "-R '10.0.0.0/8' && %{HTTP:X-Forwarded-Proto} == 'https'" PROXYCDN_HTTPS=on

    # SENDFILE=x-sendfile: Apache sends the cache files PHP chooses. PHP
    # hands them over only when PROXYCDN_SENDFILE says so: without
    # mod_xsendfile this block is skipped, and PHP streams the files.
    # <IfModule mod_xsendfile.c>
    #     XSendFile On
    #     # adjust
    #     XSendFilePath /srv/proxy-cdn/public/_cache
    #     SetEnv PROXYCDN_SENDFILE x-sendfile
    # </IfModule>

    # An access log with the X-Cache-Status of each response, to count the
    # hits Apache serves without PHP, which /metrics never sees (PRX-9).
    # LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" cache=%{X-Cache-Status}o %D" proxycdn
    # CustomLog ${APACHE_LOG_DIR}/proxy-cdn.access.log proxycdn
</VirtualHost>

<VirtualHost *:80>
    # adjust
    ServerName cdn.example.com
    # ServerAlias static.example.org                # the other PROXY_HOSTS
    # adjust
    DocumentRoot /srv/proxy-cdn/public
    UseCanonicalName Off

    # Plain HTTP is redirected to https by public/.htaccess: the same
    # rules as the :443 virtual host, included the same way. Only the
    # hosts listed here are redirected, never to a name the proxy does
    # not serve; PHP answers any other host with 421.
    # adjust: every host of PROXY_HOSTS
    SetEnvIfNoCase Host "^(cdn\.example\.com)(:[0-9]+)?$" PROXYCDN_HOST=on
    # adjust
    <Directory /srv/proxy-cdn/public>
        AllowOverride None
        Require all granted
        # adjust
        Include /srv/proxy-cdn/public/.htaccess
    </Directory>

    # As in the :443 virtual host: the requests that are not redirected
    # (from a trusted TLS-terminating proxy below, or for a host outside
    # the list above) reach PHP here.
    <FilesMatch "\.php$">
        # adjust
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ProxyTimeout 300

    # Behind a TLS-terminating reverse proxy or load balancer, which usually
    # forwards to this port, list its addresses here as well (as in the :443
    # virtual host and in TRUSTED_PROXIES): without this line its
    # X-Forwarded-Proto is ignored, and every request is redirected to https
    # again, in a loop. docker/cluster/ shows the same setup with nginx.
    # SetEnvIfExpr "-R '10.0.0.0/8' && %{HTTP:X-Forwarded-Proto} == 'https'" PROXYCDN_HTTPS=on
</VirtualHost>
